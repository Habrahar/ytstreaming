<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101513"><title>Музыка · ytstreaming</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#101513;color:#eef3ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 38%,#23342955,transparent 60%)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #c5edaa;outline-offset:4px}.topbar{position:relative;z-index:5;padding:26px 20px 0;max-width:760px;margin:auto;display:flex;align-items:center;gap:22px}.brand{color:#c5edaa;font-size:23px;font-weight:600;letter-spacing:-1px}.search-shell{position:relative;flex:1;background:#202a24;border:1px solid #35443a;border-radius:22px;transition:background .2s,box-shadow .2s}.search-shell.open{background:#202b24;box-shadow:0 24px 80px #0008}.search-line{display:flex;align-items:center;padding:0 17px;gap:11px;height:56px}.search-icon{font-size:24px;color:#9aaca0}#search{min-width:0;width:100%;border:0;background:transparent;color:inherit;padding:12px 0;outline:none!important;font-size:16px}#search::placeholder{color:#a7b6aa}#clear{border:0;background:none;color:#b1c2b4;font-size:23px;padding:4px}.search-content{display:none;padding:0 8px 8px;border-top:1px solid #3a4b3f}.open .search-content{display:block;position:absolute;left:-1px;right:-1px;top:55px;background:#202b24;border:1px solid #35443a;border-top:0;border-radius:0 0 22px 22px;box-shadow:0 32px 64px #0007}.open{border-bottom-left-radius:0;border-bottom-right-radius:0}#searchHint{color:#a4b7a8;font-size:12px;margin:13px 12px}#results{max-height:min(62dvh,470px);overflow:auto;overscroll-behavior:contain}.result{display:flex;align-items:center;gap:13px;width:100%;padding:13px 12px;text-align:left;border:0;border-radius:12px;background:transparent;color:#eff6ed;transition:background .15s}.result:hover,.result:focus-visible{background:#34473a}.result-icon{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:#334437;color:#c8e7b4;font-size:21px}.result-copy{min-width:0;flex:1}.result strong{display:block;font-size:14px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result small{display:block;margin-top:5px;color:#a6b6aa;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.result-duration{font-size:12px;color:#a6b6aa}#backdrop{position:fixed;inset:0;background:#080d0a88;backdrop-filter:blur(7px);z-index:4}#backdrop[hidden]{display:none}main{min-height:calc(100dvh - 83px);display:flex;align-items:center;justify-content:center;padding:44px 24px 32px}.player{width:100%;max-width:400px;text-align:center}.cover{width:clamp(220px,34dvh,300px);aspect-ratio:1;margin:0 auto 34px;border-radius:28px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#486245,#273e30 55%,#15281e);box-shadow:0 30px 70px #0005}.cover::before{content:'';position:absolute;inset:0;background-image:var(--cover);background-size:cover;filter:blur(16px);opacity:.25;transform:scale(1.2)}.record{width:70%;aspect-ratio:1;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,#1d2b22 0px,#1d2b22 3px,#273b2d 4px,#1b2c21 5px);display:grid;place-items:center;box-shadow:0 8px 25px #0006}.record::after{content:'♪';width:35%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:35px;background:#b2d695;color:#233c28}.spinning .record{animation:turn 12s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}#title{font-size:clamp(23px,5vw,30px);line-height:1.2;letter-spacing:-.7px;margin:0 0 10px;font-weight:600;overflow-wrap:anywhere}#artist{color:#a8b9ac;font-size:15px;margin:0}#duration{font-size:12px;color:#7e9383;min-height:15px;margin:13px 0 0}#status{color:#a4ba9b;font-size:12px;min-height:18px;margin:22px 0 14px;letter-spacing:.2px}#play{display:grid;place-items:center;border:0;border-radius:50%;width:72px;height:72px;margin:auto;background:#c5edaa;color:#1b3020;box-shadow:0 8px 30px #b0e48a18;transition:transform .15s}#play:hover{transform:scale(1.04)}#play:disabled{cursor:default;opacity:.5}#playIcon{font-size:27px;line-height:1;letter-spacing:0}#message{font-size:13px;line-height:1.5;min-height:22px;color:#e3c592;margin:19px 0 0}#stop{font-size:12px;border:0;background:none;color:#788b7c;padding:12px;margin-top:10px}audio{display:none}footer{font-size:11px;letter-spacing:.4px;color:#657b6b;margin-top:22px}@media(max-width:540px){.topbar{padding:18px 16px 0;gap:12px}.brand{font-size:21px}.search-line{height:52px;padding:0 12px}.open .search-content{top:51px}.cover{margin-bottom:28px}main{padding:32px 20px 24px;min-height:calc(100dvh - 70px)}}@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
input[type=search]::-webkit-search-cancel-button{display:none}
#artwork{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}.has-art #artwork{opacity:1}.has-art .record{display:none}.transport{display:flex;align-items:center;justify-content:center;gap:28px}.transport #play{margin:0}.skip{border:0;width:48px;height:48px;border-radius:50%;background:transparent;color:#bed2b6;font-size:23px;letter-spacing:-5px}.skip:hover{background:#c5edaa12}.skip:disabled{opacity:.28;cursor:default}
</style></head>
<body><header class="topbar"><span class="brand" aria-label="ytstreaming">♫</span><div class="search-shell" id="searchShell"><div class="search-line"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Песня или исполнитель" aria-label="Поиск музыки" role="combobox" aria-expanded="false" aria-controls="results" autocomplete="off"><button id="clear" aria-label="Очистить поиск" hidden>×</button></div><div class="search-content"><p id="searchHint" role="status"></p><div id="results" role="listbox" aria-label="Найденные песни"></div></div></div></header>
<div id="backdrop" hidden></div><main><section class="player" id="player" data-phase="idle" aria-label="Музыкальный плеер"><div class="cover" id="cover" aria-hidden="true"><div class="record"></div><img id="artwork" alt="" decoding="async" referrerpolicy="no-referrer"></div><h1 id="title">Найди свою музыку</h1><p id="artist">Начни с поиска наверху</p><p id="duration"></p><p id="status" role="status">Подключаемся…</p><div class="transport"><button id="previous" class="skip" aria-label="Предыдущая песня" disabled>❮Ⅰ</button><button id="play" aria-label="Воспроизвести" disabled><span id="playIcon" aria-hidden="true">▶</span></button><button id="next" class="skip" aria-label="Следующая песня" disabled>Ⅰ❯</button></div><p id="message" role="alert"></p><button id="stop">Остановить общий эфир</button><footer>YOUTUBE MUSIC · ДОМАШНИЙ ЭФИР</footer><audio id="audio" preload="none" playsinline></audio></section></main><script src="/player.js" defer></script></body></html>
