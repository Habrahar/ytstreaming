name: ytstreaming
services:
  bridge:
    image: ghcr.io/habrahar/ytstreaming:${IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8090}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - library:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 160m
    cpus: 1.0
    pids_limit: 64
    environment:
      YOUTUBE_PROVIDER_URL: http://provider:8081
      LIBRARY_DIRECTORY: /data
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      AUDIO_PASSTHROUGH: ${AUDIO_PASSTHROUGH:-true}
      AUDIO_STARTUP_SECONDS: ${AUDIO_STARTUP_SECONDS:-8}
      DOTNET_GCHeapHardLimit: "0x4000000"
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  provider:
    image: ghcr.io/habrahar/ytstreaming-provider:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64
    environment:
      YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 3m
        max-file: "2"
volumes:
  library:
